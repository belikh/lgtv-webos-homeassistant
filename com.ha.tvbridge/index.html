<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HA TV Bridge</title>
  <style>
    html, body { margin: 0; padding: 0; background: #111; color: #eee; font-family: system-ui, sans-serif; }
    #root { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
    .badge { padding: 8px 16px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; }
    .hint { margin-top: 12px; font-size: 12px; color: #888; }
  </style>
</head>
<body>
  <div id="root">
    <div class="badge">HA TV Bridge — Enact placeholder (suspended)</div>
    <div class="hint">Layer 1 WebView — handlesRelaunch:true requiredMemory:120 — JS service holds Activity</div>
  </div>
  <script>
    // Layer 1 behaviour: remain warm when suspended, re-activate on webOSRelaunch.
    // Phase 2 implements Layer 2 only; this Enact placeholder reserves handlesRelaunch + requiredMemory.
    (function () {
      'use strict';

      /**
       * Activate the WebView when webOS relaunches the app.
       * @type {() => void}
       */
      function activate() {
        if (typeof PalmSystem !== 'undefined' && PalmSystem.activate) {
          try { PalmSystem.activate(); } catch (_e) { /* ignore */ }
        }
        if (typeof window !== 'undefined' && window.focus) {
          try { window.focus(); } catch (_e) { /* ignore */ }
        }
      }

      // webOSRelaunch is the system callback when handlesRelaunch:true
      // It may be invoked while in background (visibilityChange:hidden).
      // We must handle it without requiring a full reload.
      if (typeof window !== 'undefined') {
        // Expose globally as webOS expects window.webOSRelaunch
        window.webOSRelaunch = function webOSRelaunch(inLaunchParams) {
          // inLaunchParams contains launch parameters from luna or HA coordinator
          // For Phase 2 headless, we just warm and acknowledge.
          // Future Enact Lovelace will parse inLaunchParams for dashboard route.
          if (inLaunchParams && typeof console !== 'undefined' && console.log) {
            console.log('[com.ha.tvbridge] webOSRelaunch', JSON.stringify(inLaunchParams));
          }
          activate();
        };

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            activate();
          }
        });

        document.addEventListener('webOSRelaunch', function (ev) {
          // Some firmware versions dispatch DOM event instead of global call
          var detail = ev && ev.detail ? ev.detail : undefined;
          window.webOSRelaunch(detail);
        });

        // Signal ready to ActivityManager holders that UI is mounted
        if (typeof console !== 'undefined' && console.log) {
          console.log('[com.ha.tvbridge] Enact placeholder mounted — awaiting ActivityManager warm hold');
        }
      }
    }());
  </script>
</body>
</html>
